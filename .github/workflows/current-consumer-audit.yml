name: Core 2.0 current consumer read-only audit
on:
  push:
    branches: [cloud/core2-current-consumers-20261003, main]
    paths:
      - '.github/workflows/current-consumer-audit.yml'
      - 'scripts/cloud/consumer-audit.py'
      - 'scripts/cloud/ingestion-health.js'
      - 'scripts/cloud/reference-observation-history.js'
      - 'scripts/rehearse-current-consumers.js'
      - 'src/ingress/**'
      - 'src/platform/domain-*'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: core2-current-consumer-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name != 'schedule'
        run: npm run check && npm run verify:handoff && npm test
      - run: python scripts/cloud/test_consumer_audit.py
      - name: Observe isolated reference ingestion health
        run: node scripts/cloud/ingestion-health.js .consumer-audit
      - name: Capture actual consumer outputs with bounded GET requests
        if: always()
        run: python scripts/cloud/consumer-audit.py .consumer-audit
      - name: Native admission and three-source Near Me consumer rehearsal
        run: node scripts/rehearse-current-consumers.js .consumer-audit
      - name: Summarize actual sampled reference observations without opening operational gates
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloud/reference-observation-history.js .consumer-audit
      - name: Save exact captures and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core2-current-consumer-audit
          path: .consumer-audit
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

