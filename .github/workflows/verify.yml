name: Isolated foundation verification
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run verify:handoff
      - run: npm test
      - name: Reopen signed native authority snapshot after disposing its source
        run: node scripts/rehearse-authority-snapshot.js
      - name: Restore a frozen authority and verify persisted state after native restart
        run: node scripts/rehearse-frozen-recovery.js
      - name: Independently reopen actual cloud recovery evidence with pinned trust
        run: |
          python -c "import hashlib,json,pathlib,zipfile; r=pathlib.Path('evidence/core2-cloud-recovery-20261003'); m=json.loads((r/'ARTIFACTS.json').read_text()); p=r/m['cloud_archive']['file']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['cloud_archive']['sha256']; zipfile.ZipFile(p).extractall('.cloud-recovery')"
          node scripts/cloud/verify-frozen-recovery-proof.js .cloud-recovery evidence/core2-cloud-recovery-20261003/TRUST_PINS.json
      - name: Independently reopen real Cron backups and validate their schemas
        run: |
          python -m pip install jsonschema==4.25.1
          python -c "import hashlib,json,pathlib,zipfile; root=pathlib.Path('evidence/core2-source-feed-20261003'); m=json.loads((root/'ARTIFACTS.json').read_text()); p=root/m['scheduled_feed']['file']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['scheduled_feed']['sha256']; zipfile.ZipFile(p).extractall('.cloud-readback')"
          node scripts/cloud/verify-scheduled-backups.js .cloud-readback
          python scripts/check-domain-bridge-schemas.py .cloud-readback/SIGNED_SCHEMA_SAMPLES.json domain-continuous-isolated > .cloud-readback/SCHEMA_VALIDATION.json
          cat .cloud-readback/SCHEMA_VALIDATION.json
      - run: npm run rehearse:technical
      - run: npm run readiness:technical
      - run: npm run check:cloud-bundles
      - name: Preserve independent signature and schema results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core2-independent-signed-schema-readback
          path: |
            .cloud-readback/INDEPENDENT_READBACK.json
            .cloud-readback/SCHEMA_VALIDATION.json
            .authority-snapshot/SNAPSHOT.json
            .authority-snapshot/TRUST.json
            .authority-snapshot/VERIFICATION.json
            .frozen-recovery/*.json
            .cloud-recovery/INDEPENDENT_READBACK.json
          retention-days: 14
