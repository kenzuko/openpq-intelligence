name: Isolated foundation verification
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run verify:handoff
      - run: npm test
      - run: npm run rehearse:technical
      - run: npm run readiness:technical
      - run: npm run check:cloud-bundles
