name: Read-only live Weather source preflight
on:
  push:
    branches: ['feat/weather-canonical-fact-scope-20261004']
    paths: ['scripts/weather-source-live-preflight.js', '.github/workflows/weather-source-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/weather-source-live-preflight.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-six-live-source-preflight
          path: weather-source-live-preflight/
          retention-days: 30
          if-no-files-found: error
