name: Core 2.0 stable authority scheduled feed
on:
  push:
    branches: [cloud/core2-stable-feed-20261003]
permissions:
  contents: read
concurrency:
  group: intelligence-isolated-cloud-proof
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: intelligence-test
    env:
      CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
      CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
      R2_TEST_READ_ACCESS_KEY_ID: ${{ secrets.R2_TEST_READ_ACCESS_KEY_ID }}
      R2_TEST_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_READ_SECRET_ACCESS_KEY }}
      CF_PRODUCTION_ACCOUNT_IDS: ${{ vars.CF_PRODUCTION_ACCOUNT_IDS }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm run verify:handoff && npm test
      - name: Read-only exact account/resource preflight
        run: node scripts/cloud/preflight.js
      - name: Prepare existing source Worker config
        run: node scripts/cloud/ingestion-patch-config.js
      - name: Resume narrow actors on existing native authority and signer
        run: node scripts/cloud/ingestion-resume.js resume
      - name: Observe real cron and independently verify signed publications
        run: node scripts/cloud/ingestion-resume.js observe
      - name: Retain verified feed or close failed activation
        if: always()
        run: node scripts/cloud/ingestion-resume.js cleanup
      - name: Save only public evidence and portable publications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core2-stable-scheduled-feed
          path: |
            .cloud-proof/preflight.json
            .cloud-proof/feed-evidence.public.json
            .cloud-proof/scheduled-backups
            .cloud-proof/ingestion-patch.json
          retention-days: 14
          if-no-files-found: error

