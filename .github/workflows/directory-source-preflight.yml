name: Read-only live Directory publication preflight
on:
  push:
    branches: ['feat/directory-canonical-publication-20261004']
    paths: ['scripts/directory-source-live-preflight.js','.github/workflows/directory-source-preflight.yml','src/ingress/directory-*.js']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/directory-source-live-preflight.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-three-file-live-preflight
          path: directory-live-preflight/
          retention-days: 30
          if-no-files-found: error
