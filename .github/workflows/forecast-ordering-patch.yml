name: Isolated Core Forecast ordering patch with rollback
on:
  push:
    branches: [cloud/core2-forecast-ordering-fix-20261003]
permissions:
  contents: read
concurrency:
  group: intelligence-isolated-cloud-proof
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: intelligence-test
    env:
      CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
      CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
      CF_PRODUCTION_ACCOUNT_IDS: ${{ vars.CF_PRODUCTION_ACCOUNT_IDS }}
      R2_TEST_READ_ACCESS_KEY_ID: ${{ secrets.R2_TEST_READ_ACCESS_KEY_ID }}
      R2_TEST_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_READ_SECRET_ACCESS_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Preserve current bindings and patch only isolated Core code
        run: node scripts/cloud/patch-forecast-ordering.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-forecast-ordering-patch-${{ github.run_id }}
          path: .forecast-ordering-patch/*.json
          include-hidden-files: true
          retention-days: 14
